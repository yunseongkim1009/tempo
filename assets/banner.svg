<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TEMPO — the scheduler with rhythm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0f15"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(1050 60) rotate(130) scale(520)">
      <stop stop-color="#7cf7c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7cf7c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(120 460) rotate(-50) scale(560)">
      <stop stop-color="#a996ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a996ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c6ff3d"/>
      <stop offset="0.5" stop-color="#7cf7c4"/>
      <stop offset="1" stop-color="#63c7ff"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c6ff3d"/>
      <stop offset="1" stop-color="#7cf7c4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" stroke="#20242f"/>

  <!-- faint hour grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="80" y1="120" x2="1200" y2="120"/>
    <line x1="80" y1="190" x2="1200" y2="190"/>
    <line x1="80" y1="260" x2="1200" y2="260"/>
    <line x1="80" y1="330" x2="1200" y2="330"/>
  </g>
  <!-- floating event blocks -->
  <g opacity="0.9">
    <rect x="864" y="132" width="150" height="56" rx="10" fill="#c6ff3d" fill-opacity="0.16" stroke="#c6ff3d" stroke-opacity="0.5"/>
    <rect x="864" y="132" width="4" height="56" rx="2" fill="#c6ff3d"/>
    <rect x="1030" y="205" width="150" height="86" rx="10" fill="#a996ff" fill-opacity="0.16" stroke="#a996ff" stroke-opacity="0.5"/>
    <rect x="1030" y="205" width="4" height="86" rx="2" fill="#a996ff"/>
    <rect x="864" y="228" width="150" height="70" rx="10" fill="#63c7ff" fill-opacity="0.16" stroke="#63c7ff" stroke-opacity="0.5"/>
    <rect x="864" y="228" width="4" height="70" rx="2" fill="#63c7ff"/>
    <rect x="864" y="312" width="316" height="44" rx="10" fill="#ff8a6b" fill-opacity="0.14" stroke="#ff8a6b" stroke-opacity="0.45"/>
    <rect x="864" y="312" width="4" height="44" rx="2" fill="#ff8a6b"/>
    <!-- now line -->
    <line x1="820" y1="276" x2="1200" y2="276" stroke="#ff8a6b" stroke-width="2"/>
    <circle cx="820" cy="276" r="5" fill="#ff8a6b"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(80,120)">
    <rect width="60" height="60" rx="17" fill="url(#logo)"/>
    <rect x="5" y="5" width="50" height="50" rx="13" fill="#0b0d12"/>
    <path d="M30 15 v16 l11 5.5" stroke="#c6ff3d" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="238" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="6" fill="#f4f5f8">TEMPO</text>
  <text x="84" y="286" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="7" fill="#8b93a5">THE&#160;SCHEDULER&#160;WITH&#160;RHYTHM</text>

  <!-- feature pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(80,330)">
      <rect width="196" height="38" rx="19" fill="#c6ff3d" fill-opacity="0.12" stroke="#c6ff3d" stroke-opacity="0.4"/>
      <text x="98" y="24.5" text-anchor="middle" fill="#c6ff3d">⌘K natural language</text>
    </g>
    <g transform="translate(288,330)">
      <rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#2a3040"/>
      <text x="84" y="24.5" text-anchor="middle" fill="#aeb4c2">drag to schedule</text>
    </g>
    <g transform="translate(468,330)">
      <rect width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#2a3040"/>
      <text x="75" y="24.5" text-anchor="middle" fill="#aeb4c2">zero backend</text>
    </g>
  </g>
</svg>
